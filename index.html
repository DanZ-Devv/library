<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Library</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="library">
        <h1>The Library</h1>
        <button class="add-book">Add Book</button>
        <dialog class="popup">  <!-- Native dialog element - hidden by default until .showModal() is called -->
            <form class="book-info">
                <h3>Enter Book Details</h3>
                <div class="field">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>
                <div class="field">
                    <label for="author">Author</label>
                    <input type="text" id="author" name="author" required>
                </div>
                <div class="field">
                    <label for="pages">Number of Pages</label>
                    <input type="number" id="pages" name="pages" required>
                </div>
                <div class="field">
                    <label for="status">Status</label>
                    <select id="status" name="status" required>  <!-- select from dropdown menu -->
                        <option value="" disabled selected>Select</option>
                        <option value="Reading">Reading</option>
                        <option value="Finished">Finished</option>
                        <option value="Want to read">Want to Read</option>
                    </select>
                </div>
                <div class="buttons">
                    <!-- type="submit" triggers the form's submit event -->
                    <button type="submit" class="save">Save</button>
                    <!-- type="button" prevents this from also submitting the form -->
                    <button type="button" class="close">Close</button>
                </div>
            </form>
        </dialog>
        <h2>Available Books</h2>
        <table class="list">
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Number of Pages</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody class="book-list">

            </tbody>
        </table>
    </div>
    <script src="script.js"></script>
</body>
</html>
